name: Generate Blog Post

on:
  # schedule disabled — generation runs via Claude Desktop scheduled tasks
  # schedule:
  #   - cron: '0 14 * * 1,3,5'
  workflow_dispatch:
    inputs:
      category:
        description: 'Force a specific category (leave blank for auto-select)'
        required: false
        type: choice
        options:
          - ''
          - 'Tool Report'
          - 'Ops Brief'
          - 'Deep Bench'
          - 'Field Notes'

concurrency:
  group: generate-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install wordcloud

      - name: Configure git
        run: |
          git config user.name "Basil Brightmoor"
          git config user.email "basil-brightmoor@users.noreply.github.com"

      - name: Run generation cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            python scripts/generate.py --category "${{ github.event.inputs.category }}"
          else
            python scripts/generate.py
          fi

      - name: Push changes
        run: |
          git pull --rebase origin main
          git push
